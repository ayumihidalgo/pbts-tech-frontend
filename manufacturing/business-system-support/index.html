<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("pbts-theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
      } catch (e) {}
    })();
  </script>
  <title>Business System & Support — Manufacturing | PBTS Technology</title>
</head>
<body>
  <header class="topnav">
    <div class="nav-inner" id="nav-mount"></div>
    <div class="mobile-panel" id="mobile-nav-mount"></div>
  </header>

  <main class="page-shell">
    <div class="page-header" id="page-header-mount"></div>
    <div id="page-content-mount"></div>
  </main>

  <footer id="footer-mount"></footer>

  <script type="module">
    import { initPage } from '/src/main.js';
    initPage({
      header: {
        eyebrow: 'Manufacturing',
        breadcrumb: ["Manufacturing","Business System & Support"],
        title: 'Business System & Support',
        intro: 'Business systems, IT infrastructure, and support for manufacturing operations.'
      },
      content: { type: 'systems' }
    });
  </script>
</body>
</html>
