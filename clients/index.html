<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/pbts-logo.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("pbts-theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
      } catch (e) {}
    })();
  </script>
  <title>Clients | PBTS Technology</title>
</head>
<body>
  <header class="topnav">
    <div class="nav-inner" id="nav-mount"></div>
    <div class="mobile-panel" id="mobile-nav-mount"></div>
  </header>

  <main class="page-shell">
    <div class="page-header" id="page-header-mount"></div>
    <div id="page-content-mount"></div>
  </main>

  <footer id="footer-mount"></footer>

  <script type="module">
    import { initPage } from '/src/main.js';
    initPage({
      header: {
        eyebrow: 'Clients',
        breadcrumb: ["Clients"],
        title: 'Clients',
        intro: 'Industry leaders across electronics, automotive, and manufacturing trust PBTS with their most demanding builds.'
      },
      content: { type: 'clients' }
    });
  </script>
</body>
</html>
